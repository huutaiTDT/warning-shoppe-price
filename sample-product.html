<!-- @format -->

<!-- IMAGE PREVIEW MODAL -->
<div id="imagePreviewModal" class="image-preview-modal">
  <button id="closePreview" class="preview-close" aria-label="Đóng preview">
    ✕
  </button>

  <button id="prevPreview" class="preview-nav prev" aria-label="Ảnh trước">
    ❮
  </button>

  <img id="previewImage" src="" alt="Preview" />

  <button id="nextPreview" class="preview-nav next" aria-label="Ảnh tiếp theo">
    ❯
  </button>
</div>

<style>
  .image-preview-modal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.92);
    z-index: 999999;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    transition:
      opacity 0.25s ease,
      visibility 0.25s ease;
    padding: 30px;
    backdrop-filter: blur(6px);
  }

  .image-preview-modal.active {
    opacity: 1;
    visibility: visible;
  }

  .image-preview-modal img {
    max-width: 96%;
    max-height: 94vh;
    border-radius: 22px;
    box-shadow: 0 25px 70px rgba(0, 0, 0, 0.55);
    animation: previewZoom 0.25s ease;
    background: white;
    object-fit: contain;
  }

  @keyframes previewZoom {
    from {
      transform: scale(0.92);
      opacity: 0;
    }

    to {
      transform: scale(1);
      opacity: 1;
    }
  }

  .preview-close {
    position: absolute;
    top: 24px;
    right: 28px;
    width: 54px;
    height: 54px;
    border: none;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.12);
    color: white;
    font-size: 24px;
    cursor: pointer;
    transition: all 0.2s ease;
    backdrop-filter: blur(6px);
  }

  .preview-close:hover {
    background: rgba(255, 255, 255, 0.2);
    transform: scale(1.05);
  }

  .preview-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 58px;
    height: 58px;
    border: none;
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.12);
    color: white;
    font-size: 26px;
    cursor: pointer;
    transition: all 0.2s ease;
    backdrop-filter: blur(6px);
    z-index: 2;
  }

  .preview-nav:hover {
    background: rgba(255, 255, 255, 0.22);
    transform: translateY(-50%) scale(1.05);
  }

  .preview-nav.prev {
    left: 26px;
  }

  .preview-nav.next {
    right: 26px;
  }

  .image-card {
    overflow: hidden;
  }

  .image-card img {
    width: 100%;
    display: block;
    cursor: zoom-in;
    transition:
      transform 0.35s ease,
      filter 0.35s ease;
  }

  .image-card:hover img {
    transform: scale(1.03);
    filter: brightness(1.02);
  }

  body.preview-open {
    overflow: hidden;
  }

  @media (max-width: 768px) {
    .preview-nav {
      width: 48px;
      height: 48px;
      font-size: 20px;
    }

    .preview-close {
      width: 48px;
      height: 48px;
    }

    .preview-nav.prev {
      left: 12px;
    }

    .preview-nav.next {
      right: 12px;
    }
  }
</style>

<script>
  const previewModal = document.getElementById("imagePreviewModal");

  const previewImage = document.getElementById("previewImage");

  const closePreview = document.getElementById("closePreview");

  const prevPreview = document.getElementById("prevPreview");

  const nextPreview = document.getElementById("nextPreview");

  const images = Array.from(document.querySelectorAll(".image-card img"));

  let currentIndex = 0;

  function openPreview(index) {
    currentIndex = index;

    const currentImg = images[currentIndex];

    if (!currentImg) return;

    previewImage.src = currentImg.src;

    previewModal.classList.add("active");

    document.body.classList.add("preview-open");
  }

  function closeModal() {
    previewModal.classList.remove("active");

    document.body.classList.remove("preview-open");

    setTimeout(() => {
      previewImage.src = "";
    }, 200);
  }

  function showNext() {
    currentIndex = (currentIndex + 1) % images.length;

    openPreview(currentIndex);
  }

  function showPrev() {
    currentIndex = (currentIndex - 1 + images.length) % images.length;

    openPreview(currentIndex);
  }

  // Click image => open
  images.forEach((img, index) => {
    img.addEventListener("click", () => {
      openPreview(index);
    });
  });

  // Close
  closePreview.addEventListener("click", closeModal);

  // Outside click
  previewModal.addEventListener("click", (e) => {
    if (e.target === previewModal) {
      closeModal();
    }
  });

  // Nav buttons
  nextPreview.addEventListener("click", showNext);

  prevPreview.addEventListener("click", showPrev);

  // Keyboard
  document.addEventListener("keydown", (e) => {
    if (!previewModal.classList.contains("active")) return;

    if (e.key === "Escape") {
      closeModal();
    }

    if (e.key === "ArrowRight") {
      showNext();
    }

    if (e.key === "ArrowLeft") {
      showPrev();
    }
  });
</script>
