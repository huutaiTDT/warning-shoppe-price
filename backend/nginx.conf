# Nginx configuration for production deployment
# This file provides security hardening for reverse proxy

upstream app_backend {
    server 127.0.0.1:3001;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    # Redirect HTTP to HTTPS in production
    # Uncomment the following lines for production
    # return 301 https://$server_name$request_uri;
    
    # ========== SECURITY HEADERS START ==========
    
    # Add security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ========== SECURITY HEADERS END ==========

    location / {
        # ========== SECURITY BLOCKS START ==========
        
        # Block dangerous file extensions
        if ($request_uri ~* \.(xz|sql|env|env\.local|env\.production|git|svn|hg|conf)$) {
            return 403;
        }

        # Block dangerous paths
        if ($request_uri ~* (etc/passwd|phpmyadmin|wp-admin|wp-login|admin\.php|composer\.lock|package-lock\.json|Dockerfile|docker-compose\.yml)) {
            return 403;
        }

        # ========== SECURITY BLOCKS END ==========

        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Block access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

