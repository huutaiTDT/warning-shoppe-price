<!-- @format -->

<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Shopee Exporter</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet" />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --primary: #4f7cff;
        --primary-light: #edf3ff;
        --border: rgba(255, 255, 255, 0.22);
        --text: #151826;
        --muted: #8b93a7;
      }

      body {
        font-family: "Inter", sans-serif;

        width: 420px;
        min-height: 640px;

        background: linear-gradient(
          135deg,
          #cbb6ff 0%,
          #b89cff 35%,
          #9d8dff 100%
        );

        padding: 18px;

        color: var(--text);

        position: relative;

        overflow-x: hidden;
      }

      /* background blur */

      body::before {
        content: "";

        position: fixed;

        inset: 0;

        background:
          radial-gradient(
            circle at top left,
            rgba(255, 255, 255, 0.25),
            transparent 35%
          ),
          radial-gradient(
            circle at bottom right,
            rgba(255, 255, 255, 0.18),
            transparent 35%
          );

        z-index: -1;
      }

      .container {
        backdrop-filter: blur(18px);

        background: rgba(255, 255, 255, 0.82);

        border: 1px solid rgba(255, 255, 255, 0.3);

        border-radius: 30px;

        overflow: hidden;

        box-shadow:
          0 30px 60px rgba(30, 41, 59, 0.22),
          inset 0 1px 0 rgba(255, 255, 255, 0.5);
      }

      /* HEADER */

      .header {
        padding: 26px 26px 20px;

        border-bottom: 1px solid #eceef5;

        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .logo {
        width: 34px;
        height: 34px;

        border-radius: 12px;

        background: linear-gradient(135deg, #4f7cff, #7f9cff);

        display: flex;
        align-items: center;
        justify-content: center;

        color: white;

        font-size: 18px;
        font-weight: 700;
      }

      .header h1 {
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -0.5px;
      }

      .subtitle {
        color: var(--muted);

        font-size: 13px;

        margin-top: 3px;
      }

      .badge {
        background: var(--primary-light);

        color: var(--primary);

        padding: 8px 12px;

        border-radius: 999px;

        font-size: 12px;
        font-weight: 700;
      }

      /* STATS */

      .stats {
        display: grid;
        grid-template-columns: 1fr 1fr;

        gap: 14px;

        padding: 22px 26px;
      }

      .stat-card {
        background: rgba(255, 255, 255, 0.75);

        border: 1px solid #edf0f7;

        border-radius: 22px;

        padding: 18px;
      }

      .stat-label {
        font-size: 13px;

        color: var(--muted);

        margin-bottom: 10px;
      }

      .stat-value {
        font-size: 34px;
        font-weight: 800;

        letter-spacing: -1px;
      }

      .stat-small {
        font-size: 28px;
      }

      /* CONTENT */

      .content {
        padding: 0 26px 26px;
      }

      .section {
        margin-bottom: 18px;
      }

      .section label {
        display: block;

        margin-bottom: 10px;

        font-size: 14px;
        font-weight: 600;

        color: #5b6475;
      }

      .glass-box {
        background: rgba(255, 255, 255, 0.78);

        border: 1.5px solid #e8edf7;

        border-radius: 20px;

        padding: 16px 18px;

        transition: 0.25s ease;
      }

      .glass-box:hover {
        border-color: #b8cbff;
      }

      .select-box {
        display: flex;
        justify-content: space-between;
        align-items: center;

        cursor: pointer;
      }

      .select-left {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .dot {
        width: 12px;
        height: 12px;

        border-radius: 999px;
      }

      .purple {
        background: #8b7fff;
      }

      .red {
        background: #ff5d5d;
      }

      .select-text {
        font-size: 15px;
        font-weight: 700;
      }

      .arrow {
        color: #9ca3af;
      }

      textarea {
        width: 100%;

        border: 2px solid #5f84ff;

        background: rgba(255, 255, 255, 0.55);

        border-radius: 20px;

        padding: 18px;

        font-family: inherit;

        resize: none;

        min-height: 110px;

        outline: none;

        font-size: 15px;

        transition: 0.25s ease;
      }

      textarea:focus {
        box-shadow: 0 0 0 5px rgba(79, 124, 255, 0.12);
      }

      textarea::placeholder {
        color: #a4acbb;
      }

      /* BUTTONS */

      .button-group {
        display: flex;
        flex-direction: column;

        gap: 14px;

        margin-top: 20px;
      }

      .btn {
        border: none;

        border-radius: 20px;

        padding: 16px 18px;

        font-size: 15px;
        font-weight: 700;

        cursor: pointer;

        transition: 0.25s ease;

        font-family: inherit;
      }

      .btn-primary {
        background: linear-gradient(135deg, #4f7cff, #5b8cff);

        color: white;

        box-shadow: 0 12px 30px rgba(79, 124, 255, 0.3);
      }

      .btn-primary:hover {
        transform: translateY(-2px);

        box-shadow: 0 16px 36px rgba(79, 124, 255, 0.36);
      }

      .btn-secondary {
        background: rgba(255, 255, 255, 0.72);

        border: 1px solid #e9edf5;

        color: #3b4354;
      }

      .btn-secondary:hover {
        background: white;
      }

      .btn-success {
        background: linear-gradient(135deg, #16a34a, #22c55e);

        color: white;

        box-shadow: 0 12px 30px rgba(34, 197, 94, 0.28);
      }

      .btn-success:hover {
        transform: translateY(-2px);

        box-shadow: 0 16px 36px rgba(34, 197, 94, 0.34);
      }

      .btn-danger {
        background: #ff5d5d;

        color: white;
      }

      .btn:disabled {
        opacity: 0.5;

        cursor: not-allowed;
      }

      /* RESULT */

      .result-card {
        margin-top: 22px;

        background: rgba(255, 255, 255, 0.68);

        border: 1px solid #eef1f7;

        border-radius: 24px;

        padding: 18px;
      }

      .result-title {
        font-size: 14px;
        font-weight: 700;

        margin-bottom: 12px;
      }

      .result-text {
        font-size: 14px;

        line-height: 1.7;

        color: #6b7280;
      }

      /* FOOTER */

      .footer {
        border-top: 1px solid #edf0f6;

        margin-top: 26px;

        padding: 18px 26px;

        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .user {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .avatar {
        width: 38px;
        height: 38px;

        border-radius: 999px;

        background: linear-gradient(135deg, #4f7cff, #7a98ff);

        color: white;

        display: flex;
        align-items: center;
        justify-content: center;

        font-weight: 700;
      }

      .username {
        font-weight: 700;
      }

      .footer-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .mini-btn {
        border: none;

        background: #eef3ff;

        color: #4f7cff;

        padding: 10px 14px;

        border-radius: 12px;

        font-size: 13px;
        font-weight: 700;

        cursor: pointer;
      }

      .link {
        color: #4f7cff;

        font-size: 14px;
        font-weight: 700;

        text-decoration: none;
      }

      /* MODAL */

      .modal {
        position: fixed;

        inset: 0;

        background: rgba(15, 23, 42, 0.5);

        backdrop-filter: blur(8px);

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 20px;

        z-index: 999;
      }

      .hidden {
        display: none;
      }

      .modal-content {
        width: 100%;

        background: white;

        border-radius: 28px;

        overflow: hidden;
      }

      .modal-header {
        padding: 22px 24px;

        border-bottom: 1px solid #edf0f5;

        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .modal-header h2 {
        font-size: 20px;
      }

      .close-btn {
        width: 38px;
        height: 38px;

        border-radius: 12px;

        border: none;

        background: #f4f6fb;

        cursor: pointer;

        font-size: 20px;
      }

      .modal-body {
        padding: 24px;

        max-height: 400px;

        overflow-y: auto;
      }

      .modal-footer {
        border-top: 1px solid #edf0f5;

        padding: 22px 24px;

        display: flex;
        justify-content: flex-end;
        gap: 12px;
      }

      .loading {
        display: flex;
        align-items: center;
        gap: 12px;

        margin-top: 14px;
      }

      .spinner {
        width: 20px;
        height: 20px;

        border-radius: 999px;

        border: 3px solid #dbe7ff;
        border-top-color: #4f7cff;

        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* scroll */

      ::-webkit-scrollbar {
        width: 8px;
      }

      ::-webkit-scrollbar-thumb {
        background: #d7dcef;

        border-radius: 999px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- HEADER -->
      <div class="header">
        <div>
          <div class="brand">
            <div class="logo">S</div>

            <div>
              <h1>Shopee Exporter</h1>

              <p class="subtitle">Export sản phẩm sang Excel</p>
            </div>
          </div>
        </div>

        <div class="badge">PRO</div>
      </div>

      <!-- STATS -->
      <div class="stats">
        <div class="stat-card">
          <div class="stat-label">Products Today</div>

          <div class="stat-value">1,284</div>
        </div>

        <div class="stat-card">
          <div class="stat-label">Exported</div>

          <div class="stat-value stat-small">18 Files</div>
        </div>
      </div>

      <!-- CONTENT -->
      <div class="content">
        <div class="section">
          <label>Store</label>

          <div class="glass-box select-box">
            <div class="select-left">
              <div class="dot purple"></div>

              <div class="select-text">Shopee Mall Vietnam</div>
            </div>

            <div class="arrow">⌄</div>
          </div>
        </div>

        <div class="section">
          <label>Export Type</label>

          <div class="glass-box select-box">
            <div class="select-left">
              <div class="dot red"></div>

              <div class="select-text">Product Analytics</div>
            </div>

            <div class="arrow">⌄</div>
          </div>
        </div>

        <div class="section">
          <label>Description</label>

          <textarea placeholder="Nhập ghi chú export..."></textarea>
        </div>

        <!-- BUTTONS -->
        <div class="button-group">
          <button id="loadHTML" class="btn btn-primary">
            🚀 Lấy dữ liệu hiện tại
          </button>

          <button id="export" class="btn btn-secondary">📥 Xuất Excel</button>

          <button id="pushWarningPrice" class="btn btn-success" disabled hidden>
            📡 Đẩy lên Warning Price
          </button>

          <button id="viewCache" class="btn btn-secondary">
            🗂️ Quản lý Cache
          </button>
        </div>

        <!-- RESULT -->
        <div class="result-card">
          <div class="result-title">Result</div>

          <div id="result" class="result-text">Chưa có dữ liệu export...</div>

          <div id="loading" class="loading hidden">
            <div class="spinner"></div>

            <p>Đang xử lý dữ liệu...</p>
          </div>
        </div>
      </div>

      <!-- FOOTER -->
      <div class="footer">
        <div class="user">
          <div class="avatar">T</div>

          <div>
            <div class="username">Tran Tai</div>

            <div class="subtitle">Shopee Manager</div>
          </div>
        </div>

        <div class="footer-actions">
          <button class="mini-btn">Upgrade Pro</button>

          <a href="#" class="link"> Open Desktop ↗ </a>
        </div>
      </div>
    </div>

    <!-- MODAL -->
    <div id="cacheModal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h2>🗂️ Cache Manager</h2>

          <button id="closeModal" class="close-btn">×</button>
        </div>

        <div class="modal-body">
          <div id="cacheShopsContainer">
            <p>Đang tải dữ liệu cache...</p>
          </div>
        </div>

        <div class="modal-footer">
          <button id="clearAllCache" class="btn btn-danger">Xóa cache</button>

          <button id="closeModalBtn" class="btn btn-secondary">Đóng</button>
        </div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
